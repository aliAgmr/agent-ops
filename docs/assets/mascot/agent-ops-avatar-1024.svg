  <circle cx="1632" cy="770" r="10" fill="#FFFFFF" opacity="0.8"/>
</g>
<!-- cheeks -->
<ellipse cx="1238" cy="860" rx="64" ry="36" fill="#EF4056" opacity="0.28"/>
<ellipse cx="1762" cy="860" rx="64" ry="36" fill="#EF4056" opacity="0.28"/>
