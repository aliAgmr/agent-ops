<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="860 40 1280 1280">
<defs>
  <linearGradient id="gRed" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#F46B7D"/>
    <stop offset="0.45" stop-color="#EF4056"/>
    <stop offset="1" stop-color="#C8102E"/>
  </linearGradient>
  <linearGradient id="gBody" x1="0" y1="0" x2="0.9" y2="1">
    <stop offset="0" stop-color="#EF4056"/>
    <stop offset="1" stop-color="#C8102E"/>
  </linearGradient>
  <linearGradient id="gFace" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFFFFF"/>
    <stop offset="1" stop-color="#F7EEE8"/>
  </linearGradient>
  <linearGradient id="gInk" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#3A3230"/>
    <stop offset="1" stop-color="#2A2322"/>
  </linearGradient>
  <radialGradient id="gGlow" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#1FAE7A" stop-opacity="0.45"/>
    <stop offset="1" stop-color="#1FAE7A" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="gHalo" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#EF4056" stop-opacity="0.16"/>
    <stop offset="0.7" stop-color="#EF4056" stop-opacity="0.07"/>
    <stop offset="1" stop-color="#EF4056" stop-opacity="0"/>
  </radialGradient>
  <pattern id="dots" width="64" height="64" patternUnits="userSpaceOnUse">
    <circle cx="32" cy="32" r="3.2" fill="#D5C9BF" opacity="0.55"/>
  </pattern>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
    <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#5A2A22" flood-opacity="0.16"/>
  </filter>
  <filter id="softSmall" x="-20%" y="-20%" width="140%" height="160%">
    <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#5A2A22" flood-opacity="0.14"/>
  </filter>
  <filter id="blur18" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="18"/>
  </filter>
  <filter id="blur40" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="40"/>
  </filter>
  <clipPath id="clipHead">
    <rect x="1000" y="330" width="1000" height="780" rx="310"/>
  </clipPath>
  <clipPath id="clipBody">
    <path d="M 1215 1150 C 1215 1100 1255 1075 1305 1075 L 1695 1075 C 1745 1075 1785 1100 1785 1150 L 1842 1715 C 1850 1792 1800 1842 1725 1842 L 1275 1842 C 1200 1842 1150 1792 1158 1715 Z"/>
  </clipPath>
</defs><rect x="860" y="40" width="1280" height="1280" fill="#F5EFE9"/><circle cx="1500" cy="680.0" r="601.5999999999999" fill="#EF4056" opacity="0.10"/>
<circle cx="1500" cy="178" r="150" fill="url(#gGlow)"/>
