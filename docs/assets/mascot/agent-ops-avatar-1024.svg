  <rect x="1542" y="1316" width="36" height="40" rx="18" fill="#FFF8F3"/>
  <rect x="1574" y="1340" width="10" height="70" rx="5" fill="#5A4E4A"/>
</g>
<rect x="1376" y="1420" width="248" height="160" rx="44" fill="#C8102E"/>

<!-- ear pods -->
<rect x="938" y="620" width="110" height="290" rx="55" fill="url(#gInk)"/>
<rect x="1952" y="620" width="110" height="290" rx="55" fill="url(#gInk)"/>
<rect x="958" y="700" width="30" height="130" rx="15" fill="#EF4056"/>
<rect x="2012" y="700" width="30" height="130" rx="15" fill="#EF4056"/>

