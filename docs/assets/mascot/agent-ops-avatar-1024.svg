<circle cx="1500" cy="178" r="52" fill="#1FAE7A"/>
<circle cx="1482" cy="160" r="16" fill="#FFFFFF" opacity="0.75"/>

<!-- ground shadow -->
<ellipse cx="1480" cy="1905" rx="620" ry="46" fill="#2A2322" opacity="0.12"/>

<!-- feet -->
<rect x="1255" y="1790" width="200" height="104" rx="52" fill="url(#gInk)"/>
<rect x="1545" y="1790" width="200" height="104" rx="52" fill="url(#gInk)"/>

<!-- torso -->
<g filter="url(#soft)">
  <path d="M 1215 1150 C 1215 1100 1255 1075 1305 1075 L 1695 1075 C 1745 1075 1785 1100 1785 1150 L 1842 1715 C 1850 1792 1800 1842 1725 1842 L 1275 1842 C 1200 1842 1150 1792 1158 1715 Z" fill="url(#gBody)"/>
</g>
