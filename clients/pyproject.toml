[project]
name = "agent-ops"
version = "0.1.0"
description = "Sets up a team's agent tools (task board, skills, MCP servers, safety guard, action journal) for Cursor, Codex and Kimi Code."
requires-python = ">=3.11"
dependencies = ["keyring==25.7.0"]

[project.scripts]
agent-ops = "agent_ops.cli:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_ops"]
